<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: url("/jali/jahangir-light.svg?v=3") #faf3e1; background-size: 26px 45px;

  .ur { font-family: "Noto Nastaliq Urdu", "Urdu Typesetting", serif; direction: rtl; font-size: 2rem; line-height: 2.2; color: #0c5f66; }

  p { color: #8a7458; margin: 6px 0 18px; }
  a.btn { display: inline-block; margin: 4px; padding: 10px 20px; border-radius: 12px; font-weight: 700; text-decoration: none;
          background: #12808b; color: #fffdf3; border: 1.5px solid #0c5f66; }
  a.plain { display: inline-block; margin: 4px; padding: 10px 16px; border-radius: 12px; font-weight: 600; text-decoration: none;
            background: #fffdf3; color: #3b2e1f; border: 1.5px solid #ecdcbb; }

    .card { background: #17333a; border-color: #2c4d55; }
    .ur, h1 { color: #7fd4dc; } p { color: #b8a888; }
    a.plain { background: #17333a; color: #f0e6cf; border-color: #2c4d55; }
  }
</style>
